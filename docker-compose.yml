services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: aac
      # Set POSTGRES_PASSWORD in .env (see .env.example) — and keep DATABASE_URL in sync.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aac}
      POSTGRES_DB: askanychannel
    ports:
      # Loopback only: Docker port publishing bypasses host firewalls (ufw etc.), so
      # binding 0.0.0.0 would expose the DB to the network on any VPS. The worker reaches
      # Postgres over the compose network and doesn't need this port at all.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aac -d askanychannel"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build: .
    command: aac worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://aac:${POSTGRES_PASSWORD:-aac}@postgres:5432/askanychannel
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./datasets:/app/datasets
    restart: unless-stopped
    healthcheck:
      # Same subset the worker runs at boot (core/doctor.py ROLE_CHECKS) — so it can't boot
      # healthy and be flagged unhealthy a minute later over a chat-only setting.
      test: ["CMD", "aac", "doctor", "--quiet", "--role", "worker"]
      # Generous on purpose: the check imports psycopg/yt-dlp and opens a DB connection, which
      # can take several seconds on a small VPS or Raspberry Pi. Note that Compose only *reports*
      # health (`docker compose ps`) — it does not restart an unhealthy container; that's Swarm.
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 20s

  ui:
    build:
      context: .
      args:
        # Only the ui image needs Streamlit — see Dockerfile's INSTALL_EXTRAS.
        INSTALL_EXTRAS: "ui"
    # 0.0.0.0 here overrides .streamlit/config.toml's localhost default — correct inside the
    # container, since the port below is only published on the host's loopback.
    command: ["streamlit", "run", "apps/ui/Home.py", "--server.address=0.0.0.0", "--server.port=8501"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://aac:${POSTGRES_PASSWORD:-aac}@postgres:5432/askanychannel
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    ports:
      # Loopback only, same rationale as postgres above — wider exposure is a P4 reverse-proxy
      # concern, not something compose port publishing should do directly.
      - "127.0.0.1:8501:8501"
    volumes:
      # Same host dirs as the worker: the UI's "Delete channel" removes the bundle dir, which
      # only means anything if it sees the directory the worker actually writes to.
      - ./data:/app/data
      - ./datasets:/app/datasets
    profiles: ["ui"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Same subset the UI runs on every page (core/doctor.py ROLE_CHECKS "ui").
      test: ["CMD", "aac", "doctor", "--quiet", "--role", "ui"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 20s

  api:
    build:
      context: .
      args:
        # Only the api image needs FastAPI/uvicorn — see Dockerfile's INSTALL_EXTRAS.
        INSTALL_EXTRAS: "api"
    # --factory: apps/api/main.py deliberately has no module-level `app` object (constructing
    # one would call the real get_settings() at import time) — uvicorn calls create_app() itself.
    command: ["uvicorn", "apps.api.main:create_app", "--factory", "--host=0.0.0.0", "--port=8000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://aac:${POSTGRES_PASSWORD:-aac}@postgres:5432/askanychannel
    ports:
      # Loopback only, same rationale as postgres/ui above — reverse-proxy exposure is a
      # deployment concern, not something compose port publishing should do directly.
      - "127.0.0.1:8000:8000"
    profiles: ["api"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Same subset the API runs at boot (core/doctor.py ROLE_CHECKS "api").
      test: ["CMD", "aac", "doctor", "--quiet", "--role", "api"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 20s

volumes:
  pgdata:
