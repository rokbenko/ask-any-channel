[project]
name = "ask-any-channel"
version = "0.1.0"
description = "Turn any YouTube channel into a grounded AI chatbot."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "pgvector>=0.3",
    "yt-dlp>=2024.8.6",
    "tiktoken>=0.7",
    "pyarrow>=17",
    "openai>=3",
    "anthropic>=0.34",
    "python-dotenv>=1.0",
    "streamlit>=1.50",
]

[project.scripts]
aac = "cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "cli", "apps"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# str/int/bool defaults in typer.Option/Argument are exempt from B008 automatically (ruff
# treats them as immutable); Path isn't in ruff's built-in immutable-type list, so extend
# the exemption explicitly rather than restructuring every Path-typed CLI option.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
