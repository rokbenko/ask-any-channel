name: Registry schema check

# A named check for registry PRs (which are usually the only thing an outside contributor
# touches). Redundant with the pytest run in ci.yml on purpose — the status appears under a
# name that tells a first-time contributor exactly what was checked.
on:
  pull_request:
    paths: ["registry/channels.json", "registry/schema.json"]
  push:
    branches: [main]
    paths: ["registry/channels.json", "registry/schema.json"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.30"
          python-version: "3.11"
          enable-cache: true

      - run: uv sync --locked --group dev

      - run: uv run python scripts/validate_registry.py
